name: ${PROJECT_NAME}

services:
  # 1) WEB FRONTEND
  web-frontend-server:
    build:
      context: ./web-frontend-server
    container_name: web-frontend-server
    ports:
      - "${WEB_PORT}:80"
    networks: [default]
    restart: unless-stopped

  # 2) APPLICATION BACKEND
  application-backend-server:
    build:
      context: ./application-backend-server
    container_name: application-backend-server
    environment:
      - PORT=${APP_INTERNAL_PORT}
    ports:
      - "${APP_PUBLIC_PORT}:${APP_INTERNAL_PORT}"
    expose:
      - "${APP_INTERNAL_PORT}"
    networks: [default]
    restart: unless-stopped

  # 3) RELATIONAL DATABASE
  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/mysql
    networks: [default]
    restart: unless-stopped

  # 4) AUTH & IDENTITY (Keycloak dev)
  authentication-identity-server:
    image: quay.io/keycloak/keycloak:26.0
    container_name: authentication-identity-server
    command: ["start-dev", "--import-realm"]
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_PASSWORD}
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./authentication-identity-server/realm:/opt/keycloak/data/import:ro
    networks: [default]
    restart: unless-stopped

  # 5) OBJECT STORAGE (MinIO)
  object-storage-server:
    image: minio/minio:latest
    container_name: object-storage-server
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}" --address ":${MINIO_API_PORT}"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:${MINIO_API_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    volumes:
      - ./object-storage-server/data:/data
    networks: [default]
    restart: unless-stopped

  # 6) INTERNAL DNS (Bind9)
  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    volumes:
      - ./internal-dns-server/named.conf:/etc/bind/named.conf:ro
      - ./internal-dns-server/named.conf.options:/etc/bind/named.conf.options:ro
      - ./internal-dns-server/named.conf.local:/etc/bind/named.conf.local:ro
      - ./internal-dns-server/db.cloud.local:/var/lib/bind/db.cloud.local:ro
    networks: [default]
    restart: unless-stopped
    ports:
      - "${DNS_PORT_UDP}:53/udp"
      - "${DNS_PORT_TCP}:53/tcp"

  # 7) MONITORING - Prometheus
  monitoring-prometheus-server:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus-server
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [default]
    restart: unless-stopped
    depends_on:
      - monitoring-node-exporter-server

  # 8) MONITORING - Grafana
  monitoring-grafana-dashboard-server:
    image: grafana/grafana-oss:latest
    container_name: monitoring-grafana-dashboard-server
    ports:
      - "${GRAFANA_PORT}:3000"
    networks: [default]
    restart: unless-stopped
    depends_on:
      - monitoring-prometheus-server

  # 9) MONITORING - Node Exporter
  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    expose:
      - "9100"
    networks: [default]
    restart: unless-stopped

  # 10) API GATEWAY / REVERSE PROXY
  api-gateway-proxy-server:
    image: nginx:1.27
    container_name: api-gateway-proxy-server
    ports:
      - "${PROXY_PORT}:80"
    volumes:
      - ./api-gateway-proxy-server/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [default]
    restart: unless-stopped
    depends_on:
      - web-frontend-server
      - application-backend-server
      - authentication-identity-server
      - object-storage-server

networks:
  default:
    name: cloud-net
    external: true

volumes:
  db_data:
