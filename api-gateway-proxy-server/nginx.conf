# ================== NGINX GATEWAY CONFIG ==================
# Reverse proxy toàn bộ dịch vụ qua cổng 80

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;

  # ------------ Upstreams trỏ theo tên service trong cloud-net ------------
  upstream web_upstream            { server web-frontend-server:80; }
  upstream app_upstream            { server application-backend-server:8081; }
  upstream auth_upstream           { server authentication-identity-server:8080; }
  upstream minio_api_upstream      { server object-storage-server:9000; }
  upstream minio_console_upstream  { server object-storage-server:9001; }

  server {
    listen 80;
    server_name _;

    # 1) WEB: / và /blog/ tới Nginx tĩnh
    location = /        { proxy_pass http://web_upstream/; }
    location  /blog/    { proxy_pass http://web_upstream;  }

    # 2) API: /api/* -> app (strip prefix /api/)
    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://app_upstream;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_http_version      1.1;
      proxy_buffering         off;
      proxy_request_buffering off;
    }

    # 3) AUTH (Keycloak): /auth/* -> giữ path sau khi bỏ prefix
    #  - Lưu ý: Discovery đúng là /realms/<realm>/.well-known/openid-configuration
    location /auth/ {
      rewrite ^/auth/?(.*)$ /$1 break;
      proxy_pass http://auth_upstream;

      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version      1.1;
      proxy_buffering         off;
    }

    # 4) MINIO CONSOLE: đặt trước /minio/ để không nhầm
    location /minio/console/ {
      rewrite ^/minio/console/?(.*)$ /$1 break;
      proxy_pass http://minio_console_upstream;

      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_buffering    off;
    }

    # 5) MINIO API: /minio/* -> S3 API (400 là bình thường nếu thiếu chữ ký)
    location /minio/ {
      rewrite ^/minio/?(.*)$ /$1 break;
      proxy_pass http://minio_api_upstream;

      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_buffering    off;

      client_max_body_size 100m;  # upload object lớn
    }

    # 6) Mặc định: đẩy về web
    location / {
      proxy_pass http://web_upstream;
      proxy_set_header Host $host;
    }

    location /student/ {
      proxy_pass http://application-backend-server:8081/student;
    }
  }
}
